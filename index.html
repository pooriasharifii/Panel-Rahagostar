<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درگاه یکپارچه رها گستر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-950: #08192a;
    --navy-800: #0e3753;
    --navy-700: #16496d;
    --gold-500: #d2ab66;
    --gold-400: #ecd4a0;
    --bg-0: #eef2f7;
    --bg-1: #dde6f0;
    --ink-900: #16212e;
    --ink-600: #52667a;
    --card-face: rgba(255,255,255,0.62);
    --card-border: rgba(255,255,255,0.6);
    --spot: rgba(255,255,255,0.5);
    --shadow-color: rgba(14,55,83,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-0: #070f18; --bg-1: #0b1a29;
      --ink-900: #eef2f7; --ink-600: #93a5b8;
      --card-face: rgba(18,30,44,0.55); --card-border: rgba(210,171,102,0.2);
      --spot: rgba(226,196,138,0.16);
      --shadow-color: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg-0: #070f18; --bg-1: #0b1a29;
    --ink-900: #eef2f7; --ink-600: #93a5b8;
    --card-face: rgba(18,30,44,0.55); --card-border: rgba(210,171,102,0.2);
    --spot: rgba(226,196,138,0.16);
    --shadow-color: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg-0);
    color: var(--ink-900);
    font-family: "Vazirmatn", -apple-system, "Segoe UI", sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
  }

  /* ---- Ambient aurora background ---- */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg-0); }
  .aurora span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; will-change: transform; }
  .aurora span:nth-child(1) { width: 46vw; height: 46vw; top: -14vw; right: -10vw; background: var(--navy-700); animation: drift1 22s ease-in-out infinite; }
  .aurora span:nth-child(2) { width: 34vw; height: 34vw; bottom: -12vw; left: -8vw; background: var(--gold-500); opacity: 0.28; animation: drift2 26s ease-in-out infinite; }
  .aurora span:nth-child(3) { width: 28vw; height: 28vw; top: 30%; left: 20%; background: var(--navy-800); opacity: 0.22; animation: drift3 30s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-6vw, 8vw) scale(1.12); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(8vw, -6vw) scale(1.15); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(4vw, 6vw) scale(0.9); } }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 20px 56px; position: relative; }

  /* ---- Hero ---- */
  header.hero {
    position: relative; border-radius: 28px; padding: 58px 32px 48px; text-align: center; overflow: hidden;
    background: linear-gradient(150deg, var(--navy-950) 0%, var(--navy-800) 45%, var(--navy-700) 78%, var(--gold-500) 150%);
    box-shadow: 0 28px 70px -22px var(--shadow-color);
    border: 1px solid rgba(210,171,102,0.35);
    isolation: isolate;
  }
  header.hero::before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(700px 260px at 12% -10%, rgba(226,196,138,0.22), transparent 60%),
                radial-gradient(500px 220px at 100% 110%, rgba(226,196,138,0.14), transparent 60%);
  }
  header.hero .sweep {
    content: ""; position: absolute; top: 0; left: -120%; width: 55%; height: 100%; z-index: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
    animation: sweep 7s ease-in-out infinite;
  }
  @keyframes sweep { 0% { left: -120%; } 45%,100% { left: 130%; } }

  .particles { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .particles i { position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold-400); opacity: 0; animation: floatUp linear infinite; }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0.6); }
    12% { opacity: 0.9; }
    90% { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-160px) scale(1); }
  }

  .status {
    position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px;
    font-size: 0.78rem; color: var(--gold-400); font-weight: 600; margin-bottom: 16px;
    opacity: 0; animation: rise 0.7s 0.05s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.55); } 70% { box-shadow: 0 0 0 8px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }

  header.hero h1 {
    position: relative; z-index: 1; margin: 0; overflow: hidden;
    max-width: 740px; margin-inline: auto;
  }
  header.hero h1 .reveal {
    display: inline-block; color: #fff; font-weight: 800;
    font-size: clamp(1.55rem, 3.4vw, 2.5rem); line-height: 1.55;
    text-shadow: 0 4px 20px rgba(0,0,0,0.35);
    opacity: 0; transform: translateX(36px);
    animation: titleIn 0.85s 0.15s cubic-bezier(.16,.8,.24,1) forwards;
  }
  @keyframes titleIn { to { opacity: 1; transform: translateX(0); } }

  .hero-sub {
    position: relative; z-index: 1; margin: 16px auto 0; max-width: 560px; color: rgba(255,255,255,0.78);
    font-size: 0.98rem; line-height: 1.9; opacity: 0; animation: rise 0.8s 0.5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- Grid (centered, flexible) ---- */
  main.grid {
    margin-top: 34px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    perspective: 900px;
  }

  .card {
    --accent: var(--gold-500); --mx: 50%; --my: 50%;
    position: relative; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; text-align: right;
    text-decoration: none; color: var(--ink-900);
    background: var(--card-face);
    border: 1px solid var(--card-border);
    border-radius: 18px; padding: 22px 20px 20px;
    flex: 0 1 232px; width: 232px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 26px -14px var(--shadow-color);
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s ease, border-color 0.3s ease;
    opacity: 0; transform: translateX(46px);
    animation: cardIn 0.7s cubic-bezier(.16,.8,.24,1) forwards;
    overflow: hidden;
    transform-style: preserve-3d;
    will-change: transform;
  }
  @keyframes cardIn { to { opacity: 1; transform: translateX(0); } }

  .card::before {
    content: ""; position: absolute; inset-inline-start: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px;
    background: var(--accent); opacity: 0.85;
  }
  .card .spotlight {
    position: absolute; inset: 0; z-index: 0; opacity: 0; transition: opacity 0.3s ease;
    background: radial-gradient(180px circle at var(--mx) var(--my), var(--spot), transparent 70%);
  }
  .card:hover .spotlight, .card:focus-visible .spotlight { opacity: 1; }

  .card .shine {
    position: absolute; top: 0; left: -60%; width: 40%; height: 100%; z-index: 0;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-18deg); transition: left 0.65s cubic-bezier(.2,.8,.2,1); pointer-events: none;
  }
  .card:hover .shine { left: 130%; }

  .card:hover, .card:focus-visible { box-shadow: 0 20px 40px -16px var(--shadow-color); border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .card .icon {
    position: relative; z-index: 1; font-size: 1.9rem; line-height: 1; width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center; border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .card:hover .icon { transform: scale(1.15) rotate(-6deg); }
  .card .label { position: relative; z-index: 1; font-weight: 700; font-size: 1.02rem; line-height: 1.6; }
  .card .go {
    position: relative; z-index: 1; margin-top: auto; font-size: 0.82rem; color: var(--ink-600);
    display: flex; align-items: center; gap: 6px; transition: gap 0.25s ease, color 0.25s ease;
  }
  .card:hover .go { gap: 10px; color: var(--accent); }

  .c1  { --accent: #2563eb; } .c2  { --accent: #d97706; }
  .c3  { --accent: #0891b2; } .c4  { --accent: #dc2626; }
  .c5  { --accent: #4f46e5; } .c6  { --accent: #7c3aed; }
  .c7  { --accent: #db2777; } .c8  { --accent: #d97706; }
  .c9  { --accent: #059669; } .c10 { --accent: #7c3aed; }
  .c11 { --accent: #d2ab66; }

  footer { margin-top: 36px; text-align: center; color: var(--ink-600); font-size: 0.86rem; line-height: 1.9; padding: 18px 12px; }
  footer b { color: var(--gold-500); }
  footer strong { color: var(--ink-900); }

  @media (prefers-reduced-motion: reduce) {
    .aurora span, header.hero .sweep, .particles i, .status .dot { animation: none !important; }
    .status, header.hero h1 .reveal, .hero-sub, .card { animation: none !important; opacity: 1 !important; transform: none !important; }
    .card { transition: none !important; }
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>

<div class="wrap">
  <header class="hero">
    <div class="sweep"></div>
    <div class="particles" id="particles"></div>
    <div class="status"><span class="dot"></span> همه سامانه‌ها آنلاین</div>
    <h1><span class="reveal">پنل نرم‌افزارهای تحت وب رها گستر</span></h1>
    <p class="hero-sub">دسترسی سریع پرسنل به تمام سامانه‌ها و ابزارهای شرکت، از یک نقطه‌ی واحد.</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    © 2025‒2026 | این سامانه حاصل توسعه <b>واحد R&amp;D</b> و تحت مالکیت <strong>شرکت رها گستر تجارت فرداد</strong> می‌باشد.
  </footer>
</div>

<script>
  // Ambient particles
  const pWrap = document.getElementById("particles");
  for (let i = 0; i < 16; i++) {
    const dot = document.createElement("i");
    dot.style.left = `${Math.random() * 100}%`;
    dot.style.animationDuration = `${6 + Math.random() * 6}s`;
    dot.style.animationDelay = `${Math.random() * 8}s`;
    pWrap.appendChild(dot);
  }

  // Cards — staggered right-to-left entrance
  const items = [
    { href: "https://Rahagostar.pal.ir/1gbek", icon: "📑", label: "کدینگ و شرح کالا", cls: "c1" },
    { href: "https://Rahagostar.pal.ir/sfucn", icon: "🛠️", label: "ثبت کالاهای گارانتی", cls: "c2" },
    { href: "https://Rahagostar.pal.ir/i7nzy", icon: "🚗", label: "ثبت ماموریت فروشندگان", cls: "c3" },
    { href: "https://Rahagostar.pal.ir/i467b", icon: "📅", label: "درخواست مرخصی پرسنل", cls: "c4" },
    { href: "https://rahagostar.com/webmail/", icon: "✉️", label: "ایمیل سازمانی رها گستر", cls: "c5" },
    { href: "https://mail.hamrahtelgroup.com/", icon: "📧", label: "ایمیل سازمانی همراه تل", cls: "c6" },
    { href: "https://Rahagostar.pal.ir/rnthm", icon: "📦", label: "ثبت انبار", cls: "c7" },
    { href: "https://rahagostar.club", icon: "🎯", label: "باشگاه مشتریان رها گستر", cls: "c8" },
    { href: "https://rahagostar.credit", icon: "💳", label: "اعتبارسنجی مشتریان", cls: "c9" },
    { href: "https://oauth.hamrahtelgroup.com/oauth/access_token", icon: "💬", label: "ورود به MatterMost", cls: "c10" },
    { href: "https://buffer.rahagostar.com/", icon: "📊", label: "داشبورد بافر گارانتی", cls: "c11" },
  ];

  const grid = document.getElementById("grid");
  items.forEach((item, i) => {
    const a = document.createElement("a");
    a.href = item.href; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.className = `card ${item.cls}`;
    a.style.animationDelay = `${0.55 + i * 0.08}s`;
    a.innerHTML = `
      <div class="spotlight"></div>
      <div class="shine"></div>
      <div class="icon">${item.icon}</div>
      <div class="label">${item.label}</div>
      <div class="go">مشاهده ←</div>
    `;
    a.addEventListener("pointermove", (e) => {
      const r = a.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      a.style.setProperty("--mx", `${x}px`);
      a.style.setProperty("--my", `${y}px`);
      const rx = ((y / r.height) - 0.5) * -8;
      const ry = ((x / r.width) - 0.5) * 8;
      a.style.transform = `translateY(-5px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    a.addEventListener("pointerleave", () => { a.style.transform = ""; });
    grid.appendChild(a);
  });
</script>
</body>
</html>
